<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blueprintgen</title>
    <script>
      window.__APP_CONFIG__ = { appName: 'blueprintgen', logoPath: null, homeUrl: null }
      console.log('[config] defaults set, requesting:', document.baseURI + 'config.js')

      src="%BASE_URL%config.js"
      onerror="console.error('[config] config.js failed to load (network/404) — using defaults')"
    ></script>
    <script>
      console.log('[config] after config.js — __APP_CONFIG__:', JSON.stringify(window.__APP_CONFIG__))
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
